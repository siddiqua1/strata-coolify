# Strata on Coolify (Docker Compose build pack), next to Jellyfin on the same
# RX 7900 XT. Set the required variables in Coolify's environment tab; API_KEY
# as a secret. The domain is set on the service in Coolify's Domains tab (port
# 8080); Coolify adds the Traefik router and network itself.
services:
  strata:
    build:
      context: .
      dockerfile: Dockerfile.rocm
      args:
        ROCM_TAG: ${ROCM_TAG:-7.2.4-complete}
        STRATA_REF: ${STRATA_REF:-296b59d2f73c8f04a805df29c2fa97655adace78}
    restart: unless-stopped
    # The engine releases tens of GB of page-locked RAM on SIGTERM, which takes
    # longer than Docker's default 10 s.
    stop_grace_period: 60s
    devices:
      - /dev/kfd
      - /dev/dri
    # Numeric host GIDs: group names inside the Ubuntu image do not match
    # Arch's GIDs. On this host: getent group video render -> 985, 989.
    group_add:
      - "${VIDEO_GID:-985}"
      - "${RENDER_GID:-989}"
    ipc: host
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # Backstop above Strata's resident footprint: IQ3_XXS keeps ~31 GB of
    # experts in RAM (the card holds the rest) + ~2.2 GB of k8v4 KV at 200K +
    # runtime. It keeps a runaway Strata from taking Jellyfin down with it.
    mem_limit: 38g
    # Half the default weight: Jellyfin wins when the CPU is contended.
    cpu_shares: 512
    # The image's healthcheck probes :8080, which does not answer until the
    # first start has downloaded the model (~58 GB, about an hour). Traefik
    # skips containers that are "starting" or "unhealthy", so the route would
    # not exist during that first download. The server's own GET /health is
    # still there for clients and monitoring.
    healthcheck:
      disable: true
    environment:
      API_KEY: ${API_KEY:?set API_KEY}
      FAMILY: ${FAMILY:-qwen}
      MODEL: ${MODEL:-IQ2_XS}
      KV: ${KV:-k8v4}
      KV_STREAMING: ${KV_STREAMING:-on}
      CONTEXT: ${CONTEXT:-204800}
      LOW_RAM: ${LOW_RAM:-resident}
      IDLE_UNLOAD_S: ${IDLE_UNLOAD_S:-1800}
      LAZY_LOAD: ${LAZY_LOAD:-true}
      VRAM_RESERVE_MIB: ${VRAM_RESERVE_MIB:-3072}
    volumes:
      # Model files, MTP layer and config (~70 GB). An NVMe directory that does
      # not hold Jellyfin's media or transcode directory.
      - ${STRATA_DATA_PATH:-/home/ash/strata}:/data
    expose:
      - "8080"
    # No Traefik labels or networks here: Coolify generates the router from the
    # domain set in the Domains tab, attaches the service to its own network and
    # connects coolify-proxy to it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
