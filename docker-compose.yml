# Strata 0.2.10 on Coolify (Docker Compose build pack), next to Jellyfin on the
# same RX 7900 XT. Set the required variables in Coolify's environment tab;
# API_KEY as a secret. The domain is set on the service in Coolify's Domains
# tab (port 8080); Coolify adds the Traefik router and network itself.
#
# This image is built from the v0.2.10 source and the signed 0.1.56 HIP engine
# package, because upstream has no 0.2.10 ROCm image tag yet. Once
# `ghcr.io/niko1221/strata:0.2.10-rocm-gfx110x` exists, replace `build:` with
# `image: ghcr.io/niko1221/strata:0.2.10-rocm-gfx110x` and drop the build args.
services:
  strata:
    build:
      context: .
      dockerfile: Dockerfile.rocm
      args:
        STRATA_VERSION: ${STRATA_VERSION:-0.2.10}
        # Filled from the v0.2.10 release; change only together with the
        # Dockerfile defaults.
        ENGINE_SHA256: ${ENGINE_SHA256:-b57768c85db8aa47f6bd62352df561f22504420a9629c49a573749a9555c6b1d}
    restart: unless-stopped
    # The engine unloads the model and releases tens of GB of page-locked RAM
    # on SIGTERM, which takes longer than Docker's default 10 s.
    stop_grace_period: 2m
    devices:
      - /dev/kfd
      - /dev/dri
    # Numeric host GIDs: group names inside the Ubuntu image do not match
    # Arch's GIDs. On this host: getent group video render -> 985, 989.
    group_add:
      - "${VIDEO_GID:-985}"
      - "${RENDER_GID:-989}"
    ipc: host
    shm_size: 2gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # Backstop above the measured footprint: IQ2_XS maps 33 GB of experts
    # through the file cache (the card holds the rest) + two request slots +
    # runtime; Docker measured 34.4 GiB. It keeps a runaway Strata from taking
    # Jellyfin down with it.
    mem_limit: 40g
    # Half the default weight: Jellyfin wins when the CPU is contended.
    cpu_shares: 512
    environment:
      API_KEY: ${API_KEY:?set API_KEY}
      FAMILY: ${FAMILY:-qwen}
      MODEL: ${MODEL:-IQ2_XS}
      KV: ${KV:-k8v4}
      CONTEXT: ${CONTEXT:-131072}
      # Two batch slots: an agent and one helper (or two helpers) decode
      # together instead of queueing behind one another. On this card the
      # experts mostly live in RAM, so a second slot costs some single-request
      # speed; the latency of a subagent fan-out is what it buys.
      PARALLEL: ${PARALLEL:-2}
      VISION: ${VISION:-off}
      TUNE: ${TUNE:-skip}
      # 3 GB left for Jellyfin's VAAPI transcodes; MTP drafts in both batch
      # slots (the solo path already uses the MTP). The entrypoint reads this
      # space-separated list; leading `--` options become engine args.
      STRATA_SET: ${STRATA_SET:---vram-reserve-mib=3072 --batch-mtp=1}
    volumes:
      # Model files, MTP layer and config (~119 GB from the old layout; the
      # 0.2.x entrypoint moves /data/{models,packs,mtp} into /data/Strata-data
      # on first start, without copying). An NVMe directory that does not hold
      # Jellyfin's media or transcode directory.
      - ${STRATA_DATA_PATH:-/home/ash/strata}:/data
    expose:
      - "8080"
    # No Traefik labels or networks here: Coolify generates the router from the
    # domain set in the Domains tab, attaches the service to its own network and
    # connects coolify-proxy to it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
